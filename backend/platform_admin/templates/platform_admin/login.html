<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LotNeeti staff sign in</title></head>
<body>
  <main>
    <h1>LotNeeti staff sign in</h1>
    {% if error %}<p role="alert">The sign-in details could not be verified.</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <p><label>Email <input name="email" type="email" autocomplete="username" required></label></p>
      <p><label>Password <input name="password" type="password" autocomplete="current-password" required></label></p>
      <p><label>Authenticator code <input name="code" inputmode="numeric" pattern="[0-9]{6}" autocomplete="one-time-code" required></label></p>
      <button type="submit">Sign in</button>
    </form>
  </main>
</body>
</html>
