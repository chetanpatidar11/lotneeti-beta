[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lotneeti-backend"
version = "0.1.0"
description = "LotNeeti Django API and deterministic planning services"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35,<2",
  "certifi>=2026.7,<2027",
  "celery>=5.5,<5.6",
  "cryptography>=45,<47",
  "Django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<3.3",
  "pyotp>=2.9,<3",
  "python-dotenv>=1.1,<2",
  "pypdf>=6,<7",
  "redis>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-django>=4.11,<5",
  "ruff>=0.12,<0.13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["accounts*", "applications*", "config*", "core*", "exports*", "funding*", "investors*", "ipos*", "ops*", "planner*", "platform_admin*", "portfolio*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]
