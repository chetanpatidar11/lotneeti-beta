name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, codex/autopilot]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: lotneeti
          POSTGRES_USER: lotneeti
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lotneeti -d lotneeti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_SECRET_KEY: ci-only-placeholder
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: lotneeti
      POSTGRES_USER: lotneeti
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            mobile/package-lock.json
      - name: Install backend
        run: python -m pip install -e 'backend[dev]'
      - name: Install frontend
        run: npm ci --prefix web
      - name: Install Android packaging dependencies
        run: npm ci --prefix mobile
      - name: Check local services and migrate PostgreSQL
        run: |
          python -c 'import os, redis; assert redis.Redis.from_url(os.environ["REDIS_URL"]).ping()'
          python backend/manage.py migrate --noinput
          python backend/manage.py check
      - name: Test, lint, typecheck, migration drift, and build
        run: bash scripts/check.sh
